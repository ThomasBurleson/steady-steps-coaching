
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <title>Steady-Steps Life Coaching</title>
      <meta name="description" content="Steady Steps Coaching — 1-on-1 mental-health and life coaching with Chelsea. Clarify, simplify, and build sustainable routines that fit your life." />
      <meta name="robots" content="index, follow" />

      <!-- Preload the hero LCP image so the preload scanner fetches it during
           HTML parse, in parallel with the JS bundle — not after React renders.
           Responsive: imagesrcset/imagesizes mirror the <img> in Hero.tsx so the
           preload picks the SAME variant the img will (mobile ≈ 53KB, not 573KB).
           `href` is the fallback for browsers without imagesrcset. -->
      <link
        rel="preload"
        as="image"
        href="/forest-1280.avif"
        imagesrcset="/forest-768.avif 768w, /forest-1280.avif 1280w, /forest-1800.avif 1800w"
        imagesizes="100vw"
        fetchpriority="high"
      />

      <!-- Warm up the Google Fonts connections early; the stylesheet itself is
           pulled via @import in src/styles/fonts.css. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>

      <!-- Hidden static form so Netlify's build-time bot detects the form + fields.
           The live form is rendered by React and submits via fetch (see Contact.hook.ts). -->
      <form name="contact" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <textarea name="primaryAreas"></textarea>
        <textarea name="biggestHurdle"></textarea>
        <input name="bot-field" />
      </form>

      <!-- Hidden form for the background lead POST fired when a Calendly booking
           completes (see CalendlyProvider.tsx). The webhook → SMS is the primary
           notification; this just records the booking under Netlify → Forms. -->
      <form name="booking" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="event-uri" />
        <input type="text" name="invitee-uri" />
        <input type="text" name="scheduled-at" />
        <input name="bot-field" />
      </form>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
